<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aether — API Portal</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>
    body { margin: 0; background: #fafafa; }
    #topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 20px; background: #1b1b1b; color: #fff;
      font-family: sans-serif;
    }
    #topbar .logo { font-weight: 700; font-size: 18px; letter-spacing: 1px; }
    #topbar .logo span { color: #7dd3fc; }
    #topbar a { color: #7dd3fc; text-decoration: none; font-size: 13px; margin-left: auto; }
    #swagger { max-width: 1200px; margin: 0 auto; }
  </style>
</head>
<body>
  <div id="topbar">
    <div class="logo">⚡ <span>aether</span> — API Portal</div>
    <a href="https://github.com/podtan/pdt" target="_blank" rel="noopener">podtan/pdt ↗</a>
  </div>
  <div id="swagger"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        url: "./pdt-openapi.json",
        dom_id: "#swagger",
        docExpansion: "list",
        defaultModelsExpandDepth: -1,
        tryItOutEnabled: true,
        persistAuthorization: true,
      });
    };
  </script>
</body>
</html>
